name: Deploy Firebase (functions + rules)
on:
  push:
    branches: [main]
    paths: ["functions/**", "firestore.rules", "firebase.json", ".firebaserc", ".github/workflows/firebase-deploy.yml"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install --prefix functions
      - run: npm install -g firebase-tools@latest
      - name: Remove a half-created function from a previous failed deploy (ignored if absent)
        run: firebase functions:delete reminders --region europe-west1 --project meal-stick-tracker --force || true
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      - name: Deploy
        run: firebase deploy --only functions,firestore:rules --project meal-stick-tracker --non-interactive --force --debug 2>&1 | tee deploy.log | grep -vE "^\[debug\] .*(<<< \[apiv2\]\[body\]|>>> \[apiv2\]\[body\])" ; test ${PIPESTATUS[0]} -eq 0
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      - name: Show the real error if deploy failed
        if: failure()
        run: grep -iE "error|denied|permission|failed|status" deploy.log | grep -v "apiv2\]\[body" | tail -60
